apiVersion: v1
kind: Pod
metadata:
  name: statut
  labels:
    app: statut
spec:
  containers:
  - name: page
    image: busybox:1.36
    command: ["sh", "-c", "mkdir -p /www && echo 'la boutique va bien' > /www/statut && httpd -f -p 8080 -h /www"]
    ports:
    - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: statut
spec:
  selector:
    app: statut
  ports:
  - port: 80
    targetPort: 8080
