apiVersion: v1
kind: Pod
metadata:
  name: heritier
  namespace: heritage
spec:
  containers:
  - name: porteur
    image: busybox:1.36
    command: ["sh", "-c", "sleep 86400"]
    volumeMounts:
    - name: reserve
      mountPath: /reserve
  volumes:
  - name: reserve
    persistentVolumeClaim:
      claimName: heritage-data
