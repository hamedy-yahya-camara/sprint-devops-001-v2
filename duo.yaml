apiVersion: v1
kind: Pod
metadata:
  name: duo
spec:
  containers:
    - name: guichet
      image: busybox:1.36
      command: ["sh", "-c", "mkdir -p /www && echo 'bonjour de la boite guichet' > /www/index.html && httpd -f -p 8080 -h /www"]
    - name: visiteur
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3; while true; do wget -qO- http://localhost:8080; sleep 5; done"]
